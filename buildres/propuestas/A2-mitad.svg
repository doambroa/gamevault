<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><defs>
  <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b2140"/><stop offset="1" stop-color="#08080f"/></linearGradient>
  <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e63946"/><stop offset=".55" stop-color="#7c3aed"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
  <linearGradient id="body" gradientUnits="userSpaceOnUse" x1="90" y1="140" x2="420" y2="420"><stop offset="0" stop-color="#ef4b5b"/><stop offset=".6" stop-color="#7c3aed"/><stop offset="1" stop-color="#4c1d95"/></linearGradient>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".55"/></filter>
</defs>
<rect x="16" y="16" width="480" height="480" rx="112" fill="url(#tile)"/>
<rect x="21" y="21" width="470" height="470" rx="107" fill="none" stroke="url(#frame)" stroke-width="10"/>
<defs>
  <clipPath id="L"><rect x="0" y="0" width="256" height="512"/></clipPath><clipPath id="R"><rect x="256" y="0" width="256" height="512"/></clipPath>
  <g id="silueta">
    <rect x="92" y="166" width="328" height="118" rx="56"/>
    <rect x="96" y="218" width="104" height="172" rx="52" transform="rotate(16 148 304)"/>
    <rect x="312" y="218" width="104" height="172" rx="52" transform="rotate(-16 364 304)"/>
  </g>
  <linearGradient id="n64" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d4d7df"/><stop offset="1" stop-color="#8b90a0"/></linearGradient>
  <linearGradient id="ps2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c3247"/><stop offset="1" stop-color="#11141f"/></linearGradient>
</defs>
<g filter="url(#shadow)">
  <use href="#silueta" fill="url(#n64)" clip-path="url(#L)"/>
  <use href="#silueta" fill="url(#ps2)" clip-path="url(#R)"/>
</g>
<line x1="256" y1="150" x2="256" y2="300" stroke="url(#frame)" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
<!-- N64: cruceta y botones C amarillos -->
<g transform="translate(168 218)" fill="#2b2f3d"><rect x="-11" y="-32" width="22" height="64" rx="5"/><rect x="-32" y="-11" width="64" height="22" rx="5"/></g>
<circle cx="214" cy="290" r="24" fill="#5b6070"/><circle cx="214" cy="290" r="14" fill="#2b2f3d"/>
<!-- PS2: símbolos y stick -->
<g transform="translate(346 218)">
  <path d="M0,-38 L9,-22 L-9,-22 Z" fill="none" stroke="#4ade80" stroke-width="5" stroke-linejoin="round"/>
  <circle cx="28" cy="0" r="9" fill="none" stroke="#f87171" stroke-width="5"/>
  <path d="M-7,21 L7,35 M7,21 L-7,35" stroke="#60a5fa" stroke-width="5" stroke-linecap="round"/>
  <rect x="-36" y="-8" width="16" height="16" fill="none" stroke="#f472b6" stroke-width="5"/>
</g>
<circle cx="298" cy="290" r="24" fill="#0a0c14"/><circle cx="298" cy="290" r="14" fill="#2c3247"/>
</svg>
